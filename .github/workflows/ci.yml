name: Validate app

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RAYFIN_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm test -- -- --pool=forks --maxWorkers=1
      - run: npm run validate:visual
      - name: Smoke-test local setup without Fabric credentials or AI tools
        run: npm run setup -- --tenant-id aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa --client-id bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb --workspace-id cccccccc-cccc-4ccc-8ccc-cccccccccccc
      - run: npm run doctor
